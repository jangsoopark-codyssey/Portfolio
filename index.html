<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Portfolio of Jangsoo Park, a software engineer specializing in video and image processing."
  >

  <title>Jangsoo Park | Portfolio</title>

  <link rel="icon" href="./favicon.ico">

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header id="header">
    <a id="logo" href="#hero"></a>

    <button
      id="menu-button"
      type="button" 
      aria-label="Open navigation"
      aria-expanded="false"
      aria-controls="navigation"
    >
      ☰
    </button>

    <nav id="navigation">
      <ul id="navigation-list"></ul>
    </nav>
  </header>

  <main>

    <section id="hero">
      <h1 id="hero-main-text"></h1>

      <p id="hero-sub-text"></p>

      <div id="hero-cta"></div>
    </section>


    <section id="about">
      <h2 id="about-heading"></h2>

      <img
        id="about-profile-image"
        src=""
        alt=""
      >

      <h3 id="about-intro"></h3>

      <div id="about-body"></div>
    </section>


    <section id="skills">
      <h2 id="skills-heading"></h2>

      <div id="skills-list"></div>
    </section>


    <section id="projects">
      <h2 id="projects-heading"></h2>

      <div id="projects-status" aria-live="polite"></div>

      <div id="projects-list"></div>
    </section>


    <section id="contact">
      <h2 id="contact-heading"></h2>

      <p id="contact-intro"></p>

      <form id="contact-form" novalidate>
        <div id="contact-fields"></div>

        <button
          id="contact-submit"
          type="submit"
        ></button>
      </form>
    </section>

  </main>


  <footer id="footer">
    <div id="footer-links"></div>

    <p id="footer-copyright"></p>
  </footer>


  <button
    id="top-button"
    type="button"
    aria-label="Back to top"
    hidden
  ></button>


  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>

</html>
